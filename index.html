<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finix</title>

<meta name="description" content="Finix — track today. A brighter tomorrow. Private expense and credit card tracker.">
<meta name="theme-color" content="#0D0F14">
<meta name="color-scheme" content="dark light">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Finix">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./apple-touch-icon.png">

<style>
  html, body { margin: 0; padding: 0; background: #0D0F14; }
  html[data-theme="light"], html[data-theme="light"] body { background: #F4F5F8; }
  body {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  #root { min-height: 100vh; }
  #boot {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 82vh; gap: 18px;
  }
  #boot img { width: 76px; height: 76px; border-radius: 19px; opacity: .96; }
  #boot b { font-family: -apple-system, system-ui, sans-serif; font-size: 21px;
            font-weight: 650; color: #EDF0F5; letter-spacing: -.01em; margin-top: -6px; }
  #boot span {
    font-family: -apple-system, system-ui, sans-serif; font-size: 12.5px;
    color: #6B7383; letter-spacing: .02em;
  }
  html[data-theme="light"] #boot b { color: #161A21; }
  html[data-theme="light"] #boot span { color: #8A93A2; }
</style>

<script>
/* Settle light or dark before the first pixel is drawn, so opening the app
   never flashes the wrong theme. The app reads the same key afterwards. */
(function () {
  var theme = "dark";
  try {
    var saved = localStorage.getItem("tracker:theme");
    if (saved === "light" || saved === "dark") theme = saved;
    else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
  } catch (e) { /* private mode */ }
  document.documentElement.setAttribute("data-theme", theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "light" ? "#F4F5F8" : "#0D0F14");
})();
</script>
</head>
<body>
<div id="root"><div id="boot"><img src="./apple-touch-icon.png" alt=""><b>Finix</b><span>Track today. A brighter tomorrow.</span></div></div>
