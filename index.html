<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense &amp; card tracker</title>

<meta name="description" content="Private expense and credit card tracker. All data stays on this device.">
<meta name="theme-color" content="#0E1513">
<meta name="color-scheme" content="dark">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Expenses">

<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./apple-touch-icon.png">

<style>
  html, body { margin: 0; padding: 0; background: #0E1513; }
  body {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  #root { min-height: 100vh; }
  #boot {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 82vh; gap: 18px;
  }
  #boot img { width: 62px; height: 62px; border-radius: 15px; opacity: .95; }
  #boot span {
    font-family: -apple-system, system-ui, sans-serif; font-size: 12.5px;
    color: #6F7B76; letter-spacing: .02em;
  }
</style>
</head>
