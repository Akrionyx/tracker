<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finix</title>

<meta name="description" content="Finix — track today. A brighter tomorrow. Private expense and credit card tracker.">
<meta name="theme-color" content="#070C1A">
<meta name="color-scheme" content="dark">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Finix">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./apple-touch-icon.png">

<style>
  html, body { margin: 0; padding: 0; background: #070C1A; }
  body {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  #root { min-height: 100vh; }
  #boot {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 82vh; gap: 18px;
  }
  #boot img { width: 76px; height: 76px; border-radius: 19px; opacity: .96; }
  #boot b { font-family: -apple-system, system-ui, sans-serif; font-size: 21px;
            font-weight: 650; color: #EDF2FC; letter-spacing: -.01em; margin-top: -6px; }
  #boot span {
    font-family: -apple-system, system-ui, sans-serif; font-size: 12.5px;
    color: #61708F; letter-spacing: .02em;
  }
</style>
</head>
