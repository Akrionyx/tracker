<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finix</title>

<meta name="description" content="Finix — track today. A brighter tomorrow. Private expense and credit card tracker.">
<meta name="theme-color" content="#FAF8F3">
<meta name="color-scheme" content="light dark">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finix">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">

<style>
  html, body { margin: 0; padding: 0; background: #FAF8F3; }
  html[data-theme="dark"], html[data-theme="dark"] body { background: #14120F; }
  body {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  #root { min-height: 100vh; }
  #boot {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 82vh; gap: 16px;
  }
  #boot img { width: 76px; height: 76px; border-radius: 22px; opacity: .96; }
  #boot b { font-family: 'Fraunces', Georgia, serif; font-size: 26px;
            font-weight: 600; color: #1C1815; letter-spacing: -.02em; margin-top: -4px; }
  #boot span {
    font-family: 'Public Sans', -apple-system, system-ui, sans-serif; font-size: 12.5px;
    color: #7D7466; letter-spacing: .02em;
  }
  html[data-theme="dark"] #boot b { color: #F4EFE6; }
  html[data-theme="dark"] #boot span { color: #94897A; }
</style>

<script>
/* Settle light or dark before the first pixel is drawn, so opening the app
   never flashes the wrong theme. The app reads the same key afterwards.
   Light is the default now: the warm paper ground is the app's own look,
   and dark is what it turns into when the phone asks for it. */
(function () {
  var theme = "light";
  try {
    var saved = localStorage.getItem("tracker:theme");
    if (saved === "light" || saved === "dark") theme = saved;
    else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
  } catch (e) { /* private mode */ }
  document.documentElement.setAttribute("data-theme", theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#14120F" : "#FAF8F3");
})();
</script>
</head>
<body>
<div id="root"><div id="boot"><img src="./apple-touch-icon.png" alt=""><b>Finix</b><span>Track today. A brighter tomorrow.</span></div></div>
